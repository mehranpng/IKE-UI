<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKE-UI - Login</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo/ike-ui.svg') }}">
    <link rel="alternate icon" href="{{ url_for('static', filename='logo/favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <div class="login-brand-logo">
                <img src="{{ url_for('static', filename='logo/ike-ui.svg') }}" alt="IKE-UI">
            </div>
            <div class="login-version"><span class="brand-badge">v{{ app_version }}</span></div>
            <p>Enter administrator credentials to access the panel</p>
        </div>

        <div id="loginAlertBox">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="login-form" id="loginForm" novalidate onsubmit="return handleLoginSubmit(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="admin" autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">Sign In</button>
        </form>
    </div>

    <script>
        function validateLoginForm(e) {
            let valid = true;
            const uInput = document.getElementById('username');
            const pInput = document.getElementById('password');

            clearFieldError(uInput);
            clearFieldError(pInput);

            if (!uInput.value.trim()) {
                showFieldError(uInput, 'Username is required');
                valid = false;
            }

            if (!pInput.value) {
                showFieldError(pInput, 'Password is required');
                valid = false;
            }

            if (!valid) {
                if (e) e.preventDefault();
                const firstErr = document.querySelector('.input-error');
                if (firstErr) firstErr.focus();
                return false;
            }
            return true;
        }

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, function(m) {
                return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m];
            });
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            if (!validateLoginForm(e)) return false;

            const form = document.getElementById('loginForm');
            const submitBtn = form.querySelector('button[type="submit"]');
            const alertBox = document.getElementById('loginAlertBox');
            const formData = new FormData(form);

            submitBtn.disabled = true;
            submitBtn.innerText = 'Signing In...';

            try {
                const response = await fetch("{{ url_for('login') }}", {
                    method: 'POST',
                    headers: { 'X-Requested-With': 'XMLHttpRequest' },
                    body: formData
                });

                if (response.status === 429) {
                    const data = await response.json().catch(() => ({}));
                    const errMsg = data.error || 'Too many login attempts. Please try again later.';
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(errMsg)}</div>`;
                    return false;
                }

                if (response.redirected) {
                    window.location.href = response.url;
                    return false;
                }

                const res = await response.json().catch(() => null);
                if (res && res.success) {
                    window.location.href = res.redirect || "{{ url_for('dashboard') }}";
                } else if (res && res.error) {
                    alertBox.innerHTML = `<div class="alert alert-danger">${escapeHtml(res.error)}</div>`;
                } else if (response.status === 401) {
                    alertBox.innerHTML = `<div class="alert alert-danger">Invalid username or password!</div>`;
                } else {
                    form.submit();
                }
            } catch (err) {
                form.submit();
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Sign In';
            }
            return false;
        }

        function showFieldError(input, msg) {
            input.classList.add('input-error');
            const parent = input.closest('.form-group') || input.parentElement;
            let errEl = parent.querySelector('.field-error');
            if (!errEl) {
                errEl = document.createElement('div');
                errEl.className = 'field-error';
                parent.appendChild(errEl);
            }
            errEl.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> <span>${msg}</span>`;
        }

        function clearFieldError(input) {
            input.classList.remove('input-error');
            const parent = input.closest('.form-group') || input.parentElement;
            const errEl = parent.querySelector('.field-error');
            if (errEl) errEl.remove();
        }

        document.querySelectorAll('#loginForm input').forEach(input => {
            input.addEventListener('input', () => clearFieldError(input));
        });
    </script>
</body>
</html>
